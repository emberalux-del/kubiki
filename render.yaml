# A paid always-on service + persistent disk are required for this SQLite build.
# Render asks for sync:false values before deploying. No real secrets in this file.
services:
  - type: web
    name: busenka-lucky-cubes
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: gifts-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/gifts.sqlite
      - key: BOT_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOWED_TELEGRAM_ID
        sync: false
      - key: TIMEZONE
        value: Europe/Moscow
      - key: REMINDER_HOUR
        value: "10"
      - key: REMINDER_MINUTE
        value: "0"
