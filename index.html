<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Кубики удачи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:rgba(118,118,128,.12);
  --text:#1C1C1E; --text-2:#6C6C70; --text-3:#AEAEB2; --sep:rgba(60,60,67,.12);
  --accent:#5856D6; --accent-press:#4B49C2; --on-accent:#FFFFFF;
  --green:#248A3D; --green-bg:rgba(52,199,89,.14); --orange:#C93400; --orange-bg:rgba(255,149,0,.14);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
  --scrim:rgba(0,0,0,.28);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --safe-top:max(env(safe-area-inset-top,0px), calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)));
  --safe-bottom:max(env(safe-area-inset-bottom,0px), var(--tg-safe-area-inset-bottom,0px));
  --ease:cubic-bezier(.32,.72,0,1);
}
[data-theme="dark"]{
  --bg:#0E0E10; --surface:#1C1C1E; --surface-2:rgba(118,118,128,.24);
  --text:#F2F2F7; --text-2:#98989F; --text-3:#636366; --sep:rgba(84,84,88,.5);
  --accent:#7D7AFF; --accent-press:#6B68F0; --on-accent:#FFFFFF;
  --green:#30D158; --green-bg:rgba(48,209,88,.16); --orange:#FF9F0A; --orange-bg:rgba(255,159,10,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;-webkit-user-select:none;
  transition:background-color .3s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}

/* ---------- каркас ---------- */
.app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 16px)}
.top{position:relative;animation:rise .5s var(--ease) both}
.eyebrow{font-size:15px;font-weight:500;color:var(--text-2);margin:0 0 4px}
.title{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.022em;margin:0}
.lead{font-size:17px;line-height:1.35;color:var(--text-2);margin:8px 0 0;max-width:36ch;text-wrap:balance}
.badge{position:absolute;top:0;right:0;font-size:12px;font-weight:600;letter-spacing:.02em;
  padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}

.stage{position:relative;flex:1;min-height:200px;margin:8px -20px 0}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:none;display:block}

.bottom{display:flex;flex-direction:column;gap:10px;animation:rise .5s .08s var(--ease) both}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;
  display:flex;align-items:center;gap:14px;min-height:72px}
.card .ic{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--surface-2)}
.card .l1{font-size:17px;font-weight:600;letter-spacing:-.01em}
.card .l2{font-size:15px;color:var(--text-2);margin-top:2px;font-variant-numeric:tabular-nums}

.btn{height:50px;border-radius:14px;font-size:17px;font-weight:600;width:100%;
  transition:transform .12s ease,background-color .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:active{background:var(--accent-press)}
.btn-plain{color:var(--accent);height:44px;font-weight:500}

/* ---------- загрузка внутри сцены ---------- */
.loader{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;color:var(--text-2);font-size:15px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--text-2);animation:spin .8s linear infinite}

/* ---------- запасной вариант без WebGL ---------- */
.tiles{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 20px;perspective:800px}
.tile{width:min(28vw,110px);aspect-ratio:1;border-radius:24px;position:relative;transform-style:preserve-3d;
  transition:transform .7s var(--ease)}
.tile .f{position:absolute;inset:0;border-radius:inherit;display:grid;place-items:center;backface-visibility:hidden;
  font-family:var(--font-round);font-weight:700;box-shadow:var(--shadow)}
.tile .front{color:#fff;font-size:44px}
.tile .back{transform:rotateY(180deg);background:#fff;color:#1C1C1E;font-size:22px}
.tile.open{transform:rotateY(180deg)}
.tile.dim{opacity:.55}

/* ---------- нижние шторки ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .35s ease;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--surface);
  border-radius:28px 28px 0 0;padding:8px 20px calc(var(--safe-bottom) + 20px);
  transform:translateY(105%);transition:transform .45s var(--ease);max-height:86vh;overflow:auto;
  box-shadow:0 -8px 40px rgba(0,0,0,.12)}
.sheet.on{transform:none}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--text-3);opacity:.5;margin:0 auto 16px}
.sheet h2{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:4px 0 4px}
.sheet .sub{font-size:15px;color:var(--text-2);margin:0 0 18px}

.prize-top{text-align:center;padding:6px 0 4px}
.prize-eyebrow{font-size:15px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
.prize-amount{font-family:var(--font-round);font-size:60px;line-height:1.05;font-weight:700;letter-spacing:-.03em;
  margin:10px 0 6px;font-variant-numeric:tabular-nums}
.prize-amount .cur{color:var(--accent);font-size:.6em;margin-left:6px}
.prize-note{font-size:17px;color:var(--text-2);margin:0 0 20px}
.status{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:500;
  padding:12px 14px;border-radius:14px;background:var(--surface-2);color:var(--text-2);margin-bottom:16px;transition:all .3s}
.status.ok{background:var(--green-bg);color:var(--green)}
.status.warn{background:var(--orange-bg);color:var(--orange)}
.status .spinner{width:16px;height:16px;border-width:2px}

.list{background:var(--bg);border-radius:16px;overflow:hidden;margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:17px}
.row+.row{border-top:.5px solid var(--sep)}
.row b{font-weight:600;font-variant-numeric:tabular-nums}
.tag{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.tag.rare{background:rgba(255,204,0,.2);color:#A05A00}
[data-theme="dark"] .tag.rare{color:#FFD60A}

/* ---------- полноэкранные состояния ---------- */
.state{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(var(--safe-top) + 24px) 32px calc(var(--safe-bottom) + 24px);background:var(--bg);z-index:20;
  animation:rise .5s var(--ease) both}
.state .art{width:88px;height:88px;border-radius:24px;display:grid;place-items:center;font-size:44px;
  background:var(--surface);box-shadow:var(--shadow);margin-bottom:24px}
.state h2{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.state p{font-size:17px;color:var(--text-2);margin:0 0 28px;max-width:28ch;line-height:1.4}
.state .btn{max-width:320px;text-decoration:none;display:grid;place-items:center}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media (max-height:640px){.title{font-size:28px}.lead{font-size:15px}.card{min-height:64px}}
</style>
</head>
<body>

<main class="app" id="app">
  <header class="top">
    <p class="eyebrow" id="greet">&nbsp;</p>
    <h1 class="title" id="title">Кубики удачи</h1>
    <p class="lead" id="lead">&nbsp;</p>
    <span class="badge hidden" id="testBadge">Тест</span>
  </header>

  <section class="stage" id="stage" aria-label="Кубики">
    <div class="loader" id="loader"><div class="spinner"></div><span>Готовим кубики…</span></div>
  </section>

  <footer class="bottom">
    <div class="card" id="infoCard">
      <div class="ic" id="infoIcon">🎲</div>
      <div><div class="l1" id="infoL1">Одна попытка в день</div><div class="l2" id="infoL2">Нажмите на любой кубик</div></div>
    </div>
    <button class="btn btn-plain" id="secondaryBtn">Какие бывают призы</button>
  </footer>
</main>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="resultSheet" role="dialog" aria-label="Ваш приз">
  <div class="grabber"></div>
  <div class="prize-top">
    <div class="prize-eyebrow">Ваш приз на сегодня</div>
    <div class="prize-amount" id="prizeAmount">0</div>
    <p class="prize-note" id="prizeNote">Поздравляем!</p>
  </div>
  <div class="status" id="sendStatus"><div class="spinner"></div><span>Отправляем…</span></div>
  <button class="btn btn-primary" id="doneBtn">Готово</button>
</section>

<section class="sheet" id="prizesSheet" role="dialog" aria-label="Призы">
  <div class="grabber"></div>
  <h2>Какие бывают призы</h2>
  <p class="sub">Каждый день — новая попытка</p>
  <div class="list" id="prizeList"></div>
  <button class="btn btn-primary" id="prizesClose">Понятно</button>
</section>

<div class="state hidden" id="stateView">
  <div class="art" id="stateArt">🎲</div>
  <h2 id="stateTitle"></h2>
  <p id="stateText"></p>
  <a class="btn btn-primary hidden" id="stateBtn" href="#">Открыть в Telegram</a>
</div>

<script>
/* ======================== НАСТРОЙКИ ======================== */
const CONFIG = {
  BOT_TOKEN: '8667474126:AAHR6sj2Rs6AvyqmiafkCFvY-AUJOdWCTSo',
  BOT_USERNAME: 'amandice2026_bot',
  OWNER_CHAT_ID: '1940913266',   // сюда приходят уведомления
  OWNER_NAME: 'Аман',            // как подписать «… уже знает о выигрыше»
  PLAYER_IDS: [],                // ID супруги, например [7012345678]; пусто — может играть любой
  TIMEZONE: 'Europe/Moscow',
  CURRENCY: '₽',
  // weight — относительный шанс. Неденежный приз: { text: 'Ужин в ресторане', weight: 3 }
  PRIZES: [
    { amount: 300,  weight: 30 },
    { amount: 500,  weight: 25 },
    { amount: 1000, weight: 20 },
    { amount: 1500, weight: 12 },
    { amount: 2000, weight: 8  },
    { amount: 5000, weight: 5  },
  ],
  TEST_MODE: false,
};
/* =========================================================== */

const STORE_KEY = 'dice_last_play';
const tg = window.Telegram ? window.Telegram.WebApp : null;
const inTg = !!(tg && tg.initData);
const user = inTg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
const isOwner = !!(user && String(user.id) === String(CONFIG.OWNER_CHAT_ID));
const unlimited = CONFIG.TEST_MODE || isOwner;
const playerName = user ? (user.first_name || '') : '';
const ver = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
const hasCloud = inTg && tg.CloudStorage && ver('6.9');
const $ = id => document.getElementById(id);

/* ---------- тема ---------- */
function applyTheme() {
  const dark = tg && tg.colorScheme ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if (tg) {
    try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
    try { if (ver('7.10')) tg.setBottomBarColor(bg); } catch (e) {}
  }
  if (window.__onTheme) window.__onTheme(dark);
}
applyTheme();
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { if (ver('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
  try { tg.onEvent('themeChanged', applyTheme); } catch (e) {}
} else {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
}
const haptic = {
  tap() { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} },
  roll() { try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {} },
  win() { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} },
};

/* ---------- хранилище (облако Telegram) ---------- */
const storeGet = k => new Promise(res => {
  if (hasCloud) tg.CloudStorage.getItem(k, (err, v) => res(err ? null : (v || null)));
  else { try { res(localStorage.getItem(k)); } catch (e) { res(null); } }
});
const storeSet = (k, v) => new Promise(res => {
  if (hasCloud) tg.CloudStorage.setItem(k, v, () => res());
  else { try { localStorage.setItem(k, v); } catch (e) {} res(); }
});

/* ---------- время ---------- */
function mskParts() {
  const p = {};
  new Intl.DateTimeFormat('ru-RU', { timeZone: CONFIG.TIMEZONE, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).forEach(x => p[x.type] = +x.value);
  return p;
}
const todayKey = () => new Intl.DateTimeFormat('ru-RU', { timeZone: CONFIG.TIMEZONE, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
function greeting() {
  const h = mskParts().hour;
  const g = h >= 5 && h < 12 ? 'Доброе утро' : h >= 12 && h < 18 ? 'Добрый день' : h >= 18 && h < 23 ? 'Добрый вечер' : 'Доброй ночи';
  return playerName ? `${g}, ${playerName}` : g;
}
function untilMidnight() {
  const p = mskParts();
  const left = 86400 - (p.hour * 3600 + p.minute * 60 + p.second);
  const h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), s = left % 60;
  return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

/* ---------- призы ---------- */
const money = n => n.toLocaleString('ru-RU');
const fmt = p => p.text ? p.text : `${money(p.amount)} ${CONFIG.CURRENCY}`;
function pickWeighted(list) {
  const total = list.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (const p of list) { r -= p.weight; if (r < 0) return p; }
  return list[list.length - 1];
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- уведомление владельцу ---------- */
async function notify(text) {
  if (!CONFIG.BOT_TOKEN || !CONFIG.OWNER_CHAT_ID) return false;
  const body = new URLSearchParams({ chat_id: String(CONFIG.OWNER_CHAT_ID), text });
  for (let i = 0; i < 3; i++) {
    try { const r = await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, { method: 'POST', body }); if (r.ok) return true; } catch (e) {}
    await new Promise(r => setTimeout(r, 1500));
  }
  return false;
}
function buildMessage(prize, day) {
  const tag = unlimited ? '[ТЕСТ] ' : '';
  const who = playerName || 'Игрок';
  const idLine = user ? `\n🆔 ID игрока: ${user.id}` : '';
  const action = prize.text ? 'Нужно исполнить 😉' : 'Нужно перевести 💸';
  return `${tag}🎲 ${who} сыграла в «Кубики удачи»\n🎁 Выигрыш: ${fmt(prize)}\n📅 ${day}${idLine}\n\n${action}`;
}

/* ---------- шторки + системная кнопка «Назад» ---------- */
let openSheet = null;
function showSheet(id) {
  openSheet = $(id); openSheet.classList.add('on'); $('scrim').classList.add('on');
  try { tg.BackButton.show(); } catch (e) {}
}
function hideSheet() {
  if (!openSheet) return;
  const was = openSheet; openSheet = null;
  was.classList.remove('on'); $('scrim').classList.remove('on');
  try { tg.BackButton.hide(); } catch (e) {}
  if (was.id === 'resultSheet') afterResultClosed();
}
$('scrim').addEventListener('click', hideSheet);
$('prizesClose').addEventListener('click', hideSheet);
$('doneBtn').addEventListener('click', hideSheet);
try { tg.BackButton.onClick(hideSheet); } catch (e) {}

(function buildPrizeList() {
  const total = CONFIG.PRIZES.reduce((s, p) => s + p.weight, 0);
  $('prizeList').innerHTML = CONFIG.PRIZES.map(p => {
    const share = p.weight / total;
    const tag = share >= .2 ? ['Часто', ''] : share >= .08 ? ['Иногда', ''] : ['Редко ✨', 'rare'];
    return `<div class="row"><b>${fmt(p)}</b><span class="tag ${tag[1]}">${tag[0]}</span></div>`;
  }).join('');
})();

/* ---------- состояния интерфейса ---------- */
function setHeader(eyebrow, title, lead) { $('greet').textContent = eyebrow; $('title').textContent = title; $('lead').textContent = lead; }
function setInfo(icon, l1, l2) { $('infoIcon').textContent = icon; $('infoL1').textContent = l1; $('infoL2').textContent = l2; }
function fullState(art, title, text, withLink) {
  $('stateArt').textContent = art; $('stateTitle').textContent = title; $('stateText').textContent = text;
  const b = $('stateBtn'); b.classList.toggle('hidden', !withLink);
  if (withLink) b.href = `https://t.me/${CONFIG.BOT_USERNAME}?startapp`;
  $('stateView').classList.remove('hidden'); $('app').classList.add('hidden');
}
let countdownTimer = null;
function showDoneState(label) {
  setHeader(greeting(), 'До завтра', 'Сегодняшний приз уже ваш. Новые кубики появятся в полночь.');
  const tick = () => setInfo('🌙', `Сегодня: ${label}`, `Новая попытка через ${untilMidnight()}`);
  tick(); clearInterval(countdownTimer); countdownTimer = setInterval(tick, 1000);
  const btn = $('secondaryBtn');
  if (unlimited) { btn.textContent = 'Сыграть ещё раз (тест)'; btn.onclick = () => location.reload(); }
  else { btn.textContent = 'Какие бывают призы'; btn.onclick = () => showSheet('prizesSheet'); }
}
$('secondaryBtn').onclick = () => showSheet('prizesSheet');

/* ---------- экран результата ---------- */
let current = null;
function countUp(el, prize) {
  if (prize.text) { el.textContent = prize.text; el.style.fontSize = '40px'; return; }
  const to = prize.amount, t0 = performance.now(), dur = 900;
  const step = now => {
    const p = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
    el.innerHTML = `${money(Math.round(to * e))}<span class="cur">${CONFIG.CURRENCY}</span>`;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function setSendStatus(state) {
  const s = $('sendStatus');
  s.className = 'status' + (state === 'ok' ? ' ok' : state === 'fail' ? ' warn' : '');
  s.innerHTML = state === 'ok' ? `<span>💌 ${CONFIG.OWNER_NAME} уже знает о выигрыше</span>`
    : state === 'fail' ? `<span>Нет связи — сообщим ${CONFIG.OWNER_NAME === 'Аман' ? 'Аману' : CONFIG.OWNER_NAME} позже</span>`
    : `<div class="spinner"></div><span>Сообщаем ${CONFIG.OWNER_NAME === 'Аман' ? 'Аману' : CONFIG.OWNER_NAME}…</span>`;
}
function showResult(prize) {
  countUp($('prizeAmount'), prize);
  $('prizeNote').textContent = playerName ? `Поздравляем, ${playerName}!` : 'Поздравляем!';
  showSheet('resultSheet');
}
function afterResultClosed() {
  if (current) { revealOthers(); showDoneState(current.label); }
}

/* ---------- ход игры ---------- */
let locked = true;
function pick(index) {
  if (locked) return;
  locked = true; haptic.tap();
  const day = todayKey();
  const won = pickWeighted(CONFIG.PRIZES);                   // выигрыш строго по весам
  const rest = shuffle(CONFIG.PRIZES.filter(p => p !== won)); // в остальные кубики — другие призы для показа
  const prizes = [0, 1, 2].map(i => i === index ? won : (rest.shift() || won));
  const rec = { d: day, label: fmt(won), notified: false, msg: buildMessage(won, day) };
  current = rec;
  const saved = unlimited ? Promise.resolve() : storeSet(STORE_KEY, JSON.stringify(rec)); // фиксируем попытку сразу
  setSendStatus('pending');
  setHeader(greeting(), 'Бросаем…', 'Ещё мгновение');
  saved.then(() => notify(rec.msg)).then(ok => {
    setSendStatus(ok ? 'ok' : 'fail');
    if (ok && !unlimited) { rec.notified = true; storeSet(STORE_KEY, JSON.stringify(rec)); }
  });
  playRoll(index, prizes, () => { haptic.win(); setHeader(greeting(), 'Удача с вами 🎉', 'Вот что было в кубике'); setTimeout(() => showResult(won), 380); });
}

/* =================== 3D-СЦЕНА (three.js) =================== */
const DIE_COLORS = [['#8E8CF7', '#6A67E8'], ['#FFA98A', '#F2846A'], ['#6FD3C2', '#45B8A6']];
let playRoll, revealOthers, sleepDice;

function initThree() {
  const stage = $('stage');
  const canvas = document.createElement('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x000000, 0);
  stage.appendChild(canvas);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  const hemi = new THREE.HemisphereLight(0xffffff, 0xcfcfe0, 0.85); scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(2.5, 6, 5); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.25); rim.position.set(-4, 2, -3); scene.add(rim);

  /* скруглённый куб: сетка сгущается к рёбрам, нормали — сферические на скруглениях */
  function roundedBox(size, radius, S) {
    const g = new THREE.BoxGeometry(size, size, size, S, S, S);
    const h = size / 2, inner = h - radius, u0 = 2 / S;
    const f = u => { const a = Math.abs(u), s = Math.sign(u); return s * (a <= u0 ? a / u0 * inner : inner + (a - u0) / (1 - u0) * radius); };
    const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
    const v = new THREE.Vector3(), c = new THREE.Vector3(), d = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.set(f(pos.getX(i) / h), f(pos.getY(i) / h), f(pos.getZ(i) / h));
      c.set(THREE.MathUtils.clamp(v.x, -inner, inner), THREE.MathUtils.clamp(v.y, -inner, inner), THREE.MathUtils.clamp(v.z, -inner, inner));
      d.subVectors(v, c).normalize();
      v.copy(c).addScaledVector(d, radius);
      pos.setXYZ(i, v.x, v.y, v.z); nor.setXYZ(i, d.x, d.y, d.z);
      uv.setXY(i, (f(uv.getX(i) * 2 - 1) / h + 1) / 2, (f(uv.getY(i) * 2 - 1) / h + 1) / 2);
    }
    return g;
  }

  /* текстуры граней */
  function face(draw) {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d'); draw(g);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
  }
  const ROUND = 'ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,sans-serif';
  const closedTex = DIE_COLORS.map(([a, b]) => face(g => {
    const gr = g.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, a); gr.addColorStop(1, b);
    g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
    g.fillStyle = 'rgba(255,255,255,.95)'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `700 230px ${ROUND}`; g.fillText('?', 256, 272);
  }));
  function prizeTex(prize, i, dim) {
    return face(g => {
      g.fillStyle = dim ? '#EDEDF2' : '#FFFFFF'; g.fillRect(0, 0, 512, 512);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      const main = prize.text ? '🎁' : money(prize.amount);
      let size = 190; g.font = `700 ${size}px ${ROUND}`;
      while (g.measureText(main).width > 380 && size > 50) { size -= 6; g.font = `700 ${size}px ${ROUND}`; }
      g.fillStyle = dim ? '#8E8E93' : '#1C1C1E'; g.fillText(main, 256, prize.text ? 220 : 236);
      const sub = prize.text ? prize.text : CONFIG.CURRENCY;
      let s2 = prize.text ? 52 : 84; g.font = `600 ${s2}px ${ROUND}`;
      while (g.measureText(sub).width > 400 && s2 > 24) { s2 -= 4; g.font = `600 ${s2}px ${ROUND}`; }
      g.fillStyle = dim ? '#AEAEB2' : DIE_COLORS[i][1]; g.fillText(sub, 256, prize.text ? 360 : 372);
    });
  }
  const sleepTex = face(g => {
    g.fillStyle = '#E5E5EA'; g.fillRect(0, 0, 512, 512);
    g.fillStyle = '#AEAEB2'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `600 200px ${ROUND}`; g.fillText('☾', 256, 262);
  });
  const shadowTex = face(g => {
    const gr = g.createRadialGradient(256, 256, 0, 256, 256, 256);
    gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(.55, 'rgba(0,0,0,.18)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  });

  const SIZE = 1.25, GAP = 1.75, FLOOR = -SIZE / 2;
  const geo = roundedBox(SIZE, 0.26, 14);
  const dice = [-GAP, 0, GAP].map((x, i) => {
    const mats = Array.from({ length: 6 }, () => new THREE.MeshPhysicalMaterial({ map: closedTex[i], roughness: .32, clearcoat: .9, clearcoatRoughness: .18 }));
    const mesh = new THREE.Mesh(geo, mats);
    mesh.position.set(x, 0, 0);
    mesh.rotation.set(-.35 + Math.random() * .2, .6 * (Math.random() - .5), 0);
    const sh = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 1.7), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: .5 }));
    sh.rotation.x = -Math.PI / 2; sh.position.set(x, FLOOR - .02, 0);
    scene.add(mesh, sh);
    return { i, mesh, sh, state: 'idle', scale: 1, target: 1, anim: null, phase: Math.random() * 6 };
  });
  window.__onTheme = dark => {
    hemi.intensity = dark ? .75 : .85;
    dice.forEach(d => d.sh.material.opacity = dark ? .7 : .5);
  };
  window.__onTheme(document.documentElement.dataset.theme === 'dark');

  function setFaces(d, tex) { d.mesh.material.forEach(m => { m.map = tex; m.needsUpdate = true; }); }
  const restRot = i => new THREE.Vector3(-.32, (1 - i) * .28, 0);   // смотрят чуть к центру, видна верхняя грань

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const needW = GAP * 2 + SIZE * 1.55, needH = 3.4;
    const dist = Math.max(needH / 2 / t, needW / 2 / (t * camera.aspect));
    camera.position.set(0, dist * .32, dist); camera.lookAt(0, .15, 0); camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  /* выбор кубика касанием */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  canvas.addEventListener('pointerdown', e => {
    if (locked) return;
    const r = canvas.getBoundingClientRect();
    ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(dice.map(d => d.mesh))[0];
    if (hit) { const d = dice.find(x => x.mesh === hit.object); d.target = .9; setTimeout(() => pick(d.i), 90); }
  });

  /* бросок: прыжок с отскоком, вращение плавно гасится к итоговой позе */
  function roll(d, { H, dur, turns, tex, onLand }) {
    const r = d.mesh.rotation, tr = restRot(d.i);
    const from = new THREE.Vector3(r.x, r.y, r.z);
    const goal = new THREE.Vector3(tr.x - Math.PI * 2 * turns[0], tr.y + Math.PI * 2 * turns[1], tr.z);
    const off = new THREE.Vector3().subVectors(from, goal);
    d.anim = { t0: performance.now() / 1000, H, dur, goal, off, tex, swapped: false, onLand, tr };
    d.state = 'roll';
  }
  playRoll = (index, prizes, done) => {
    dice.forEach(d => { d.prize = prizes[d.i]; });
    const d = dice[index];
    haptic.roll();
    roll(d, { H: 1.5, dur: 1.15, turns: [2, 1], tex: prizeTex(d.prize, d.i, false), onLand: () => { d.target = 1.14; sparks(d.mesh.position); done(); } });
    dice.forEach(o => { if (o !== d) { o.target = .86; o.state = 'wait'; } });
  };
  revealOthers = () => {
    dice.filter(o => o.state === 'wait').forEach((o, k) => setTimeout(() =>
      roll(o, { H: .45, dur: .7, turns: [1, 0], tex: prizeTex(o.prize, o.i, true), onLand: () => {} }), k * 120));
  };
  sleepDice = () => dice.forEach(d => { setFaces(d, sleepTex); d.state = 'sleep'; d.target = .92; d.mesh.rotation.set(restRot(d.i).x, restRot(d.i).y, 0); });

  /* золотые искры из точек */
  let spark = null;
  function sparks(at) {
    const n = 160, p = new Float32Array(n * 3), v = [];
    for (let i = 0; i < n; i++) {
      p[i * 3] = at.x; p[i * 3 + 1] = at.y + .3; p[i * 3 + 2] = at.z;
      const a = Math.random() * Math.PI * 2, s = 1.2 + Math.random() * 2.2;
      v.push(new THREE.Vector3(Math.cos(a) * s * .8, 2.2 + Math.random() * 2.6, Math.sin(a) * s * .5));
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
    const m = new THREE.PointsMaterial({ color: 0xF5C451, size: .06, transparent: true, depthWrite: false });
    if (spark) scene.remove(spark.pts);
    spark = { pts: new THREE.Points(g, m), v, life: 0 }; scene.add(spark.pts);
  }

  const easeOut = p => 1 - Math.pow(1 - p, 3);
  let last = performance.now();
  (function loop(nowMs) {
    requestAnimationFrame(loop);
    const now = (nowMs || performance.now()) / 1000, dt = Math.min(now - last / 1000, .05); last = nowMs || performance.now();
    for (const d of dice) {
      const m = d.mesh;
      if (d.state === 'idle' || d.state === 'wait') {
        const tr = restRot(d.i);
        m.position.y = Math.sin(now * 1.5 + d.phase) * .07;
        m.rotation.x += (tr.x + Math.sin(now * .7 + d.phase) * .12 - m.rotation.x) * Math.min(dt * 2, 1);
        m.rotation.y += (tr.y + Math.sin(now * .5 + d.phase) * .22 - m.rotation.y) * Math.min(dt * 2, 1);
      } else if (d.state === 'roll') {
        const a = d.anim, p = Math.min((now - a.t0) / a.dur, 1);
        m.position.y = p < .72 ? a.H * Math.sin(Math.PI * p / .72) : a.H * .14 * Math.sin(Math.PI * (p - .72) / .28);
        const e = easeOut(p);
        m.rotation.set(a.goal.x + a.off.x * (1 - e), a.goal.y + a.off.y * (1 - e), a.goal.z + a.off.z * (1 - e));
        if (!a.swapped && p > .4) { setFaces(d, a.tex); a.swapped = true; }
        if (p >= 1) { m.position.y = 0; m.rotation.set(a.tr.x, a.tr.y, a.tr.z); d.state = 'shown'; a.onLand(); }
      } else if (d.state === 'shown' || d.state === 'sleep') {
        m.position.y += (Math.sin(now * 1.2 + d.phase) * .03 - m.position.y) * Math.min(dt * 4, 1);
      }
      d.scale += (d.target - d.scale) * Math.min(dt * 12, 1);
      m.scale.setScalar(d.scale);
      const lift = Math.max(m.position.y, 0);
      d.sh.scale.setScalar(d.scale * (1 + lift * .35));
      d.sh.material.opacity = (document.documentElement.dataset.theme === 'dark' ? .7 : .5) / (1 + lift * 1.6);
    }
    if (spark) {
      spark.life += dt;
      const a = spark.pts.geometry.attributes.position;
      spark.v.forEach((v, i) => { v.y -= 6 * dt; a.array[i * 3] += v.x * dt; a.array[i * 3 + 1] += v.y * dt; a.array[i * 3 + 2] += v.z * dt; });
      a.needsUpdate = true; spark.pts.material.opacity = Math.max(0, 1 - spark.life / 1.4);
      if (spark.life > 1.4) { scene.remove(spark.pts); spark = null; }
    }
    renderer.render(scene, camera);
  })();
}

/* ============ запасной вариант (если нет WebGL) ============ */
function initTiles() {
  const wrap = document.createElement('div'); wrap.className = 'tiles';
  const tiles = DIE_COLORS.map(([a, b], i) => {
    const t = document.createElement('button'); t.className = 'tile'; t.setAttribute('aria-label', `Кубик ${i + 1}`);
    t.innerHTML = `<div class="f front" style="background:linear-gradient(${a},${b})">?</div><div class="f back"></div>`;
    t.addEventListener('click', () => pick(i)); wrap.appendChild(t); return t;
  });
  $('stage').appendChild(wrap);
  let saved = null;
  playRoll = (index, prizes, done) => {
    saved = prizes;
    tiles.forEach((t, i) => { t.querySelector('.back').textContent = fmt(prizes[i]); });
    tiles[index].classList.add('open'); setTimeout(done, 700);
  };
  revealOthers = () => tiles.forEach(t => { if (!t.classList.contains('open')) { t.classList.add('open', 'dim'); } });
  sleepDice = () => tiles.forEach(t => { t.querySelector('.front').textContent = '☾'; t.classList.add('dim'); });
}

/* =========================== СТАРТ =========================== */
(async function init() {
  if (!inTg && !CONFIG.TEST_MODE) {
    return fullState('🎲', 'Откройте в Telegram', 'Кубики удачи работают внутри Telegram. Нажмите кнопку ниже — игра откроется сразу.', true);
  }
  if (user && CONFIG.PLAYER_IDS.length && !isOwner && !CONFIG.PLAYER_IDS.map(String).includes(String(user.id))) {
    return fullState('🎁', 'Это личный подарок', 'Эта игра создана для одного особенного человека.', false);
  }
  if (unlimited) $('testBadge').classList.remove('hidden');

  let webgl = false;
  try { webgl = !!window.THREE && !!document.createElement('canvas').getContext('webgl'); } catch (e) {}
  try { webgl ? initThree() : initTiles(); } catch (e) { initTiles(); }

  let rec = null;
  try { rec = JSON.parse(await storeGet(STORE_KEY)); } catch (e) {}
  $('loader').remove();
  const day = todayKey();

  if (rec && rec.d === day && !unlimited) {
    sleepDice(); showDoneState(rec.label);
    if (!rec.notified && rec.msg) notify(rec.msg).then(ok => { if (ok) { rec.notified = true; storeSet(STORE_KEY, JSON.stringify(rec)); } });
    return;
  }
  if (rec && rec.d !== day && !rec.notified && rec.msg) notify(rec.msg); // досылаем недоставленное
  setHeader(greeting(), 'Выберите кубик', 'В одном из них — ваш приз на сегодня');
  setInfo('🎲', 'Одна попытка в день', 'Нажмите на любой кубик');
  locked = false;
})();
</script>
